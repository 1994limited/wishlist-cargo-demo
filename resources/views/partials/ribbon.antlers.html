{{# The save button: a bookmark ribbon on the cover. ref: what to save, when it isn't the book itself (a saved edition). #}}
{{ wishlist:toggle :id="ref ?? id" :class="large ? 'ribbon-form ribbon-form--large' : 'ribbon-form'" }}
    <button type="submit" class="ribbon" title="Save {{ title }}">
        <span class="sr-only" data-wishlist-when="not-added">Save {{ title }}</span>
        <span class="sr-only" data-wishlist-when="added">Saved: {{ title }}</span>
    </button>
{{ /wishlist:toggle }}
